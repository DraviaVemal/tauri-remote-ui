version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    exclude-paths:
      - "examples/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
      cargo-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/npm-package"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
