[package]
name = "tauri-remote-ui"
version = "0.1.0"
license = "MIT"
authors = ["DraviaVemal"]
description = "A Tauri plugin that exposes the application’s UI to a web browser, allowing full interaction while the native app continues running. This enables end-to-end UI testing using existing web-based testing tools without requiring modifications to the app itself."
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-remote-ui"

[dependencies]
tauri = { version = "2.8.2" }
serde = "1.0"
thiserror = "2"
tokio = { version = "1.47.1", features = ["full"] }
actix-files = "0.6.6"
actix-ws = "0.3.0"
actix-web = "4.11.0"
futures-util = "0.3.31"
serde_json = "1.0.143"
async-trait = "0.1.89"
uuid = { version = "1.18.0", features = ["v4"] }

[build-dependencies]
tauri-plugin = { version = "2.4.0", features = ["build"] }
