[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["DraviaVemla"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2.4.0", default-features = false, features = [] }

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-remote-ui.workspace = true
