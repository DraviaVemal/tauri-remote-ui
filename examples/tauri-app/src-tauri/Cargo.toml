[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["DraviaVemla"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2.4.0", default-features = false, features = [] }

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tauri = { version = "2.8.2", features = [] }
tauri-remote-ui = { path = "../../../" }
